name: PR Title
on:
  workflow_call:

permissions: {}

jobs:
  lint-pr-title:
    name: Check PR title
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|perf|docs|chore|ci|build|refactor|test|style|revert)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::Pull request title '${TITLE}' does not follow Conventional Commits, for example 'feat: add search' or 'fix(table): keep filters'. Allowed types: feat, fix, perf, docs, chore, ci, build, refactor, test, style, revert."
            exit 1
          fi
